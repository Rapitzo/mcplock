name: mcplock
description: Fail the build when an MCP server's tool surface drifts from mcp.lock.json or contains poisoned tool text.
inputs:
  config:
    description: "Client config to read (e.g. .mcp.json). Default: every known path that exists."
    required: false
    default: ""
  lock:
    description: Lockfile path.
    required: false
    default: mcp.lock.json
  fail-on:
    description: high | medium | low | none
    required: false
    default: high
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - shell: bash
      env:
        MCPLOCK_LOCK: ${{ inputs.lock }}
        MCPLOCK_FAIL_ON: ${{ inputs['fail-on'] }}
        MCPLOCK_CONFIG: ${{ inputs.config }}
        MCPLOCK_ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$MCPLOCK_ACTION_PATH" && bun install --frozen-lockfile
        cd "$GITHUB_WORKSPACE"
        args=(check --lock "$MCPLOCK_LOCK" --fail-on "$MCPLOCK_FAIL_ON")
        if [ -n "$MCPLOCK_CONFIG" ]; then args+=(--config "$MCPLOCK_CONFIG"); fi
        bun "$MCPLOCK_ACTION_PATH/src/cli.ts" "${args[@]}"
